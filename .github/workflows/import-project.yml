name: Importar projeto do Lovable

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e extrair o projeto
        run: |
          curl -fL "https://joaopessoabuggy.lovable.app/__l5e/assets-v1/e914470a-ce75-4d49-be89-42c0207a04a8/joao-pessoa-buggy-source.zip" -o /tmp/project.zip
          rm -rf /tmp/project
          mkdir -p /tmp/project
          unzip -q /tmp/project.zip -d /tmp/project
          cp -R /tmp/project/. "$GITHUB_WORKSPACE"/
          rm -f "$GITHUB_WORKSPACE/.github/workflows/import-project.yml"
      - name: Salvar arquivos no repositório
        run: |
          git config user.name "Igor Vilarim"
          git config user.email "igorvilarim@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Importar projeto do Lovable"
          git push
